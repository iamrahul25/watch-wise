[versions]
agp = "9.4.0"
kotlin = "2.2.10"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
wearCompose = "1.7.2"
watchfacePush = "1.0.0"
watchfaceValidator = "1.1.0-alpha01"
lifecycle = "2.10.0"
composeBom = "2026.09.00"
playServicesWearable = "20.0.1"
wearRemoteInteractions = "1.2.0"
coroutinesPlayServices = "1.10.2"
concurrentFutures = "1.2.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
wear-compose-material3 = { group = "androidx.wear.compose", name = "compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-compose-navigation = { group = "androidx.wear.compose", name = "compose-navigation", version.ref = "wearCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
wear-watchfacepush = { group = "androidx.wear.watchfacepush", name = "watchfacepush", version.ref = "watchfacePush" }
# Build-time only: Google's Watch Face Push validator (creates the validation tokens).
watchface-validator-cli = { group = "com.google.android.wearable.watchface.validator", name = "validator-push-cli", version.ref = "watchfaceValidator" }
# Phone <-> watch link
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "playServicesWearable" }
wear-remote-interactions = { group = "androidx.wear", name = "wear-remote-interactions", version.ref = "wearRemoteInteractions" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutinesPlayServices" }
androidx-concurrent-futures-ktx = { group = "androidx.concurrent", name = "concurrent-futures-ktx", version.ref = "concurrentFutures" }
# Phone UI
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }

[plugins]
android-library = { id = "com.android.library", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
